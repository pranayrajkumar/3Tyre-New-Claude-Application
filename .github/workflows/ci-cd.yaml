name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_REGISTRY: docker.io   # change to your registry (e.g., ghcr.io)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Log in to Docker registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build & push backend‑department image
      - name: Build & push department image
        run: |
          docker build -t ${{ env.IMAGE_REGISTRY }}/${{ github.repository }}/dept-svc:${{ github.sha }} ./backend-department
          docker push ${{ env.IMAGE_REGISTRY }}/${{ github.repository }}/dept-svc:${{ github.sha }}

      # Build & push backend‑employee image
      - name: Build & push employee image
        run: |
          docker build -t ${{ env.IMAGE_REGISTRY }}/${{ github.repository }}/employee-svc:${{ github.sha }} ./backend-employee
          docker push ${{ env.IMAGE_REGISTRY }}/${{ github.repository }}/employee-svc:${{ github.sha }}

      # Build & push frontend image
      - name: Build & push frontend image
        run: |
          docker build -t ${{ env.IMAGE_REGISTRY }}/${{ github.repository }}/frontend:${{ github.sha }} ./frontend
          docker push ${{ env.IMAGE_REGISTRY }}/${{ github.repository }}/frontend:${{ github.sha }}

      # Update image tags in k8s manifests and push the changes
      - name: Update image tags in k8s manifests
        run: |
          sed -i "s|image: .*/dept-svc:.*|image: ${{ env.IMAGE_REGISTRY }}/${{ github.repository }}/dept-svc:${{ github.sha }}|g" k8s/dept-deploy.yaml
          sed -i "s|image: .*/employee-svc:.*|image: ${{ env.IMAGE_REGISTRY }}/${{ github.repository }}/employee-svc:${{ github.sha }}|g" k8s/employee-deploy.yaml
          sed -i "s|image: .*/frontend:.*|image: ${{ env.IMAGE_REGISTRY }}/${{ github.repository }}/frontend:${{ github.sha }}|g" k8s/frontend-deploy.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/*.yaml
          git commit -m "Update image tags to ${{ github.sha }}"
          git push

      # Optional: trigger Argo CD sync
      - name: Sync Argo CD (optional)
        if: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          ./argocd login ${{ secrets.ARGOCD_SERVER }} --auth-token ${{ secrets.ARGOCD_TOKEN }} --insecure
          ./argocd app sync <YOUR_APP_NAME>
