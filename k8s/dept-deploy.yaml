apiVersion: apps/v1
kind: Deployment
metadata:
  name: dept-svc
  namespace: employee-dir
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dept-svc
  template:
    metadata:
      labels:
        app: dept-svc
    spec:
      containers:
        - name: dept-svc
          image: bpranayraj/dept-svc:925c56ce3a78ce0abc919023432d60544cec7870
          imagePullPolicy: Always
          ports:
            - containerPort: 5002
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: mongo-uri
            - name: PORT
              value: "5002"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dept-svc
  namespace: employee-dir
spec:
  selector:
    app: dept-svc
  ports:
    - port: 5002
      targetPort: 5002
  type: ClusterIP
