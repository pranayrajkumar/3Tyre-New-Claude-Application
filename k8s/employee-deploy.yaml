apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-svc
  namespace: employee-dir
spec:
  replicas: 2
  selector:
    matchLabels:
      app: employee-svc
  template:
    metadata:
      labels:
        app: employee-svc
    spec:
      containers:
        - name: employee-svc
          image: bpranayraj/employee-svc:c1f8eae894b81f0d08719c9670ffcac0624739db
          imagePullPolicy: Always
          ports:
            - containerPort: 5001
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: mongo-uri
            - name: PORT
              value: "5001"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: employee-svc
  namespace: employee-dir
spec:
  selector:
    app: employee-svc
  ports:
    - port: 5001
      targetPort: 5001
  type: ClusterIP
